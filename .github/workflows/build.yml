name: Build and Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Install packaging tool
        run: npm install -g @vscode/vsce

      - name: Package extension
        run: vsce package --out joblog-detective.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: joblog-detective-vsix
          path: joblog-detective.vsix
          retention-days: 5

  publish-prerelease:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install publishing tools
        run: npm install -g @vscode/vsce ovsx

      - name: Compute pre-release version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const [major, minor] = pkg.version.split('.').map(Number);

          if (minor < 1) {
            throw new Error('Minor version must be >= 1');
          }

          pkg.version = `${major}.${minor - 1}.${process.env.RUN_NUMBER}`;
          fs.writeFileSync(
            'package.json',
            JSON.stringify(pkg, null, 2) + '\n'
          );
          console.log('Pre-release version: ' + pkg.version);
          NODE

      - name: Compile TypeScript
        run: npm run compile

      - name: Package prerelease
        run: vsce package --pre-release --out joblog-detective.vsix

      - name: Publish prerelease to VS Code Marketplace
        run: vsce publish --packagePath joblog-detective.vsix --pre-release --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish prerelease to Open VSX
        run: ovsx publish joblog-detective.vsix --pre-release --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && !github.event.release.prerelease

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install publishing tools
        run: npm install -g @vscode/vsce ovsx

      - name: Compile TypeScript
        run: npm run compile

      - name: Package stable release
        run: vsce package --out joblog-detective.vsix

      - name: Publish to VS Code Marketplace
        run: vsce publish --packagePath joblog-detective.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: ovsx publish joblog-detective.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
