name: Build and Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Install publishing tools
        run: npm install -g @vscode/vsce ovsx

      - name: Package extension
        run: vsce package --out joblog-detective.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: joblog-detective-vsix
          path: joblog-detective.vsix
          retention-days: 5

publish-prerelease:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install publishing tools
        run: npm install -g @vscode/vsce ovsx

      - name: Compute pre-release version
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const [major, minor, patch] = pkg.version.split('.').map(Number);
            // 1.8.0 becomes 1.7.<run_number>
            pkg.version = major + '.' + (minor - 1) + '.' + ${{ github.run_number }};
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Pre-release version: ' + pkg.version);
          "

      - name: Publish prerelease to VS Code Marketplace
        run: vsce publish --pre-release -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish prerelease to Open VSX
        run: ovsx publish --pre-release
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install publishing tools
        run: npm install -g @vscode/vsce ovsx

      - name: Publish to VS Code Marketplace
        run: vsce publish -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: ovsx publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
